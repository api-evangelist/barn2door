aid: barn2door
name: Barn2Door
description: Barn2Door is a Seattle-based commerce and business-management platform purpose-built for
  independent farmers and local food producers. It gives farms an online store, order and subscription
  management, inventory tracking, delivery and pickup logistics, integrated payments, and built-in
  marketing and customer-relationship tools, consolidating the systems a farm needs to sell
  direct-to-consumer and wholesale into a single dashboard. Barn2Door connects to partners including
  Mailchimp, QuickBooks Online, Stripe, Avalara, Shippo, Routific, Squarespace, and Facebook, but does
  not publish a public developer API or documentation portal at this time.
